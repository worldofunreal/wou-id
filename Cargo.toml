[workspace]
members = [
    "crates/wou-core",
    "crates/wou-mail",
    "crates/wou-crypto",
    "crates/wou-storage",
    "crates/wou-server",
    "crates/wou-client",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Omar Hernandez Salmeron <ohsalmeron@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/ohsalmeron/wou-id"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
lettre = { version = "0.11", features = ["tokio1-native-tls", "builder", "smtp-transport"] }
redis = { version = "0.25", features = ["tokio-comp", "aio"] }
redb = "2.1"
jsonwebtoken = "9.3"
argon2 = "0.5"
rand = "0.8"
k256 = { version = "0.13", features = ["ecdsa"] }
sha2 = "0.10"
sha3 = "0.10"
hex = "0.4"
bs58 = "0.5"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
reqwest = { version = "0.12", features = ["json"] }
urlencoding = "2.1"
