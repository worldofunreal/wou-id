# Outer wall for costly auth intake (OTP sends, anonymous creation, challenges).
# Per real client IP (restored from CF-Connecting-IP). Bursts die here,
# before Rust/Valkey/SMTP cost. App-level ladders still apply underneath.
limit_req_zone $binary_remote_addr zone=wou_auth:16m rate=30r/m;

server {
    listen 80;
    server_name id.worldofunreal.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name id.worldofunreal.com;

    ssl_certificate     /usr/local/etc/letsencrypt/live/mail.worldofunreal.com/fullchain.pem;
    ssl_certificate_key /usr/local/etc/letsencrypt/live/mail.worldofunreal.com/privkey.pem;
    include snippets/ssl-params.conf;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Costly intake endpoints share one rate-limited proxy (see zone above).
    location ~ ^/api/v1/auth/(otp|anonymous|web3/challenge|qr/start) {
        limit_req zone=wou_auth burst=8 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:25570;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
    }

    location /uploads/ {
        alias /var/db/wou-id/uploads/;
        expires 1y;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin *;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://127.0.0.1:25570;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
    }
}
