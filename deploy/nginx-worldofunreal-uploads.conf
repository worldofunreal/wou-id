# Lives in /usr/local/etc/nginx/conf.d/worldofunreal.com.conf (443 server block),
# inserted before `location / {`.
#
# Why: uploaded avatars/banners are stored under /var/db/wou-id/uploads and are
# served by id.worldofunreal.com. Records created before WOU_PUBLIC_UPLOAD_URL
# was set point at worldofunreal.com/uploads, so that host forwards them here
# instead of 404ing.
#
# ^~ is required: the site has a regex location for image extensions, and a
# regex location would otherwise win over a plain prefix match.
location ^~ /uploads/ {
    rewrite ^/uploads/(.*)$ https://id.worldofunreal.com/uploads/$1 permanent;
}
